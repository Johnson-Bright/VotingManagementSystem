<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Results — VoteMS</title>
  <link rel="stylesheet" href="../styles.css"/>
  <style>
    .result-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 22px; margin-bottom: 14px;
      display: flex; align-items: center; gap: 18px;
    }
    .result-card.winner { border-color: var(--green); background: #ECFDF5; }
    .rank {
      font-family: 'Syne', sans-serif; font-size: 1.4rem; font-weight: 800;
      min-width: 36px; text-align: center; color: var(--muted);
    }
    .rank.first { color: var(--amber); }
    .result-avatar {
      width: 48px; height: 48px; border-radius: 12px;
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      display: flex; align-items: center; justify-content: center;
      font-size: 1.3rem; flex-shrink: 0;
    }
    .result-info { flex: 1; min-width: 0; }
    .result-name { font-family: 'Syne', sans-serif; font-size: 1rem; font-weight: 700; margin-bottom: 2px; }
    .result-party { font-size: 0.8rem; color: var(--muted); margin-bottom: 8px; }
    .result-votes { font-family: 'Syne', sans-serif; font-size: 1.2rem; font-weight: 800; min-width: 80px; text-align: right; }
    .result-pct { font-size: 0.78rem; color: var(--muted); }
    .winner-crown { font-size: 1.1rem; margin-left: 6px; }
    .election-selector {
      display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 28px;
    }
    .election-tab {
      padding: 8px 18px; border-radius: 8px; font-size: 0.85rem; font-weight: 500;
      cursor: pointer; border: 1px solid var(--border); background: var(--card);
      color: var(--muted); transition: all 0.2s;
    }
    .election-tab.active { background: var(--accent); border-color: var(--accent); color: white; }
    .election-tab:hover:not(.active) { border-color: var(--accent); color: var(--text); }
  </style>
</head>
<body>

<nav>
  <a href="../index.html" class="nav-logo"><div class="dot"></div> VoteMS</a>
  <div class="nav-links">
    <a href="voter-dashboard.html">Elections</a>
    <a href="results.html" class="active">Results</a>
    <a href="../index.html">Sign out</a>
  </div>
</nav>

<div class="page" style="max-width:800px;">

  <h1>Election Results</h1>
  <p class="subtitle">Final results for completed elections</p>

  <div class="election-selector" id="electionTabs"></div>
  <div id="resultsContent"><p class="text-muted text-sm">Loading results...</p></div>

  <div class="mt-3 flex gap-3">
    <a href="voter-dashboard.html" class="btn btn-secondary">← Back to elections</a>
  </div>

</div>
<script>
  const API = 'http://localhost:5099';
  const token = localStorage.getItem('token');
  if (!token) location.href = 'login.html';

  let allElections = [];
  let currentId = null;

  async function loadResults() {
    const res = await fetch(`${API}/api/voter/results`, { headers: { 'Authorization': 'Bearer ' + token } });
    if (res.status === 401) { localStorage.clear(); location.href = 'login.html'; return; }
    allElections = await res.json();

    const tabs = document.getElementById('electionTabs');
    tabs.innerHTML = '';

    if (!allElections.length) {
      document.getElementById('resultsContent').innerHTML = '<p class="text-muted">No closed elections yet.</p>';
      return;
    }

    // Check if URL has electionId param
    const urlId = parseInt(new URLSearchParams(window.location.search).get('electionId'));
    const first = allElections.find(e => e.electionId === urlId) || allElections[0];

    allElections.forEach(e => {
      const tab = document.createElement('div');
      tab.className = 'election-tab' + (e.electionId === first.electionId ? ' active' : '');
      tab.textContent = e.electionName;
      tab.onclick = () => {
        document.querySelectorAll('.election-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        renderResults(e);
      };
      tabs.appendChild(tab);
    });

    renderResults(first);
  }

  function renderResults(election) {
    const total = election.totalVotes || 0;
    const content = document.getElementById('resultsContent');

    let rows = '';
    election.results.forEach((r, i) => {
      const pct = total > 0 ? ((r.totalVotes / total) * 100).toFixed(1) : 0;
      const isWinner = i === 0;
      const colors = ['green', '', 'purple', 'amber'];
      rows += `
        <div class="result-card ${isWinner ? 'winner' : ''}">
          <div class="rank ${isWinner ? 'first' : ''}">${i + 1}</div>
          <div class="result-avatar">${r.candidateName.charAt(0)}</div>
          <div class="result-info">
            <div class="result-name">${r.candidateName} ${isWinner ? '<span class="winner-crown">*</span>' : ''}</div>
            <div class="result-party">${r.party || 'Independent'}</div>
            <div class="progress-wrap">
              <div class="progress-bar"><div class="progress-fill ${colors[i] || ''}" style="width:${pct}%"></div></div>
            </div>
          </div>
          <div>
            <div class="result-votes" style="${isWinner ? 'color:var(--green)' : ''}">${r.totalVotes}</div>
            <div class="result-pct" style="text-align:right;">${pct}%</div>
          </div>
        </div>`;
    });

    content.innerHTML = `
      <div class="card mb-4">
        <div class="flex justify-between items-center flex-wrap gap-3">
          <div>
            <h2 style="margin-bottom:4px;">${election.electionName}</h2>
            <span class="badge badge-closed">Closed — ${new Date(election.endDate).toLocaleDateString()}</span>
          </div>
          <div class="stats-grid" style="margin:0;gap:12px;">
            <div class="stat-card" style="padding:14px 18px;">
              <div class="stat-label">Total votes</div>
              <div class="stat-value" style="font-size:1.5rem;color:var(--accent);">${total}</div>
            </div>
          </div>
        </div>
      </div>
      ${rows}`;
  }

  loadResults();
</script>

</body>
</html>
