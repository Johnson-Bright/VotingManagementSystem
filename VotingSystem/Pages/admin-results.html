<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Election Results — VoteMS Admin</title>
  <link rel="stylesheet" href="../styles.css"/>
  <style>
    .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: 230px; background: var(--bg2); border-right: 1px solid var(--border); padding: 24px 16px; display: flex; flex-direction: column; gap: 4px; z-index: 200; }
    .sidebar-logo { font-family: 'Syne', sans-serif; font-size: 1.1rem; font-weight: 800; display: flex; align-items: center; gap: 8px; padding: 8px 12px; margin-bottom: 20px; }
    .sidebar-logo .dot { width: 10px; height: 10px; background: var(--accent); border-radius: 50%; }
    .sidebar-section { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; padding: 8px 12px 4px; }
    .sidebar-link { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; text-decoration: none; font-size: 0.88rem; font-weight: 500; color: var(--muted); transition: all 0.15s; }
    .sidebar-link:hover { background: var(--bg3); color: var(--text); }
    .sidebar-link.active { background: var(--bg3); color: var(--text); }
    .sidebar-footer { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--border); }
    .main { margin-left: 230px; padding: 32px 40px; max-width: 1100px; }

    /* Compact summary bar */
    .summary-bar {
      display: flex; gap: 24px; align-items: center;
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px 20px;
      margin-bottom: 24px; flex-wrap: wrap;
    }
    .summary-item { text-align: center; }
    .summary-value { font-family: 'Syne', sans-serif; font-size: 1.3rem; font-weight: 800; }
    .summary-label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }

    /* Selector row */
    .selector-row {
      display: flex; gap: 12px; align-items: center;
      margin-bottom: 24px; flex-wrap: wrap;
    }
    .selector-row select { flex: 1; min-width: 260px; max-width: 480px; }

    /* Result rows — compact table-like */
    .result-row {
      display: flex; align-items: center; gap: 14px;
      padding: 12px 16px; border-bottom: 1px solid var(--border);
      background: var(--card);
    }
    .result-row:first-child { border-radius: var(--radius) var(--radius) 0 0; }
    .result-row:last-child { border-bottom: none; border-radius: 0 0 var(--radius) var(--radius); }
    .result-row.winner { background: #ECFDF5; border-left: 3px solid var(--green); }
    .result-wrap { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 20px; }

    .rank { font-family: 'Syne', sans-serif; font-size: 1rem; font-weight: 800; min-width: 24px; text-align: center; color: var(--muted); }
    .rank.first { color: var(--amber); }
    .avatar { width: 34px; height: 34px; border-radius: 8px; background: linear-gradient(135deg, var(--accent2), var(--accent)); display: flex; align-items: center; justify-content: center; font-size: 0.9rem; font-weight: 700; color: white; flex-shrink: 0; }
    .cand-info { flex: 1; min-width: 0; }
    .cand-name { font-weight: 600; font-size: 0.9rem; }
    .cand-party { font-size: 0.75rem; color: var(--muted); }
    .bar-wrap { flex: 2; min-width: 100px; }
    .vote-count { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 0.95rem; min-width: 40px; text-align: right; }
    .vote-pct { font-size: 0.75rem; color: var(--muted); min-width: 42px; text-align: right; }

    /* Election info strip */
    .election-info {
      display: flex; gap: 20px; align-items: center; flex-wrap: wrap;
      padding: 14px 0; margin-bottom: 16px; border-bottom: 1px solid var(--border);
    }
    .election-info h2 { margin: 0; font-size: 1.1rem; }

    .no-data { padding: 32px; text-align: center; color: var(--muted); background: var(--bg3); border-radius: var(--radius); }
    @media (max-width: 768px) { .sidebar { display: none; } .main { margin-left: 0; padding: 20px 16px; } }
  </style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-logo"><div class="dot"></div> VoteMS <span class="badge badge-admin" style="margin-left:auto;font-size:0.65rem;">Admin</span></div>
  <div class="sidebar-section">Overview</div>
  <a href="admin-dashboard.html" class="sidebar-link"> Dashboard</a>
  <a href="admin-elections.html" class="sidebar-link"> Elections</a>
  <a href="admin-voters.html" class="sidebar-link"> Voters</a>
  <a href="admin-candidates.html" class="sidebar-link"> Candidates</a>
  <div class="sidebar-section" style="margin-top:8px;">Reports</div>
  <a href="admin-results.html" class="sidebar-link active"> Results</a>
  <a href="admin-reports.html" class="sidebar-link"> Reports</a>
  <div class="sidebar-footer">
    <div style="font-size:0.82rem;color:var(--muted);padding:0 12px 10px;" id="sidebarName">Admin</div>
    <a href="login.html" class="sidebar-link" onclick="localStorage.clear()"> Sign out</a>
  </div>
</aside>

<main class="main">
  <div class="flex justify-between items-center mb-3">
    <div>
      <h1>Election Results</h1>
      <p class="subtitle">View live and final results for any election</p>
    </div>
  </div>

  <!-- Compact summary bar -->
  <div class="summary-bar">
    <div class="summary-item">
      <div class="summary-value" style="color:var(--accent);" id="statTotal">—</div>
      <div class="summary-label">Total Elections</div>
    </div>
    <div style="width:1px;height:32px;background:var(--border);"></div>
    <div class="summary-item">
      <div class="summary-value" style="color:var(--green);" id="statActive">—</div>
      <div class="summary-label">Active</div>
    </div>
    <div style="width:1px;height:32px;background:var(--border);"></div>
    <div class="summary-item">
      <div class="summary-value" style="color:var(--muted);" id="statClosed">—</div>
      <div class="summary-label">Closed</div>
    </div>
    <div style="width:1px;height:32px;background:var(--border);"></div>
    <div class="summary-item">
      <div class="summary-value" style="color:var(--amber);" id="statVotes">—</div>
      <div class="summary-label">Total Votes</div>
    </div>
  </div>

  <!-- Dropdown selector -->
  <div class="selector-row">
    <select id="electionSelect" onchange="onElectionChange()">
      <option value="">-- Select an election --</option>
    </select>
    <select id="statusFilter" style="width:auto;" onchange="populateDropdown()">
      <option value="">All statuses</option>
      <option value="Active">Active</option>
      <option value="Upcoming">Upcoming</option>
      <option value="Closed">Closed</option>
    </select>
    <button class="btn btn-secondary btn-sm" onclick="loadResults()">Refresh</button>
  </div>

  <!-- Results content -->
  <div id="resultsContent">
    <div class="no-data">Select an election from the dropdown above to view results.</div>
  </div>
</main>

<script>
  const API = 'http://localhost:5099';
  const token = localStorage.getItem('token');
  if (!token) location.href = 'login.html';

  document.getElementById('sidebarName').textContent = localStorage.getItem('fullName') || 'Admin';
  function authH() { return { 'Authorization': 'Bearer ' + token }; }

  let allElections = [];

  async function loadResults() {
    const res = await fetch(`${API}/api/admin/results`, { headers: authH() });
    if (res.status === 401) { localStorage.clear(); location.href = 'login.html'; return; }
    allElections = await res.json();

    document.getElementById('statTotal').textContent  = allElections.length;
    document.getElementById('statActive').textContent = allElections.filter(e => e.status === 'Active').length;
    document.getElementById('statClosed').textContent = allElections.filter(e => e.status === 'Closed').length;
    document.getElementById('statVotes').textContent  = allElections.reduce((s, e) => s + e.totalVotes, 0);

    populateDropdown();

    // Auto-select from URL param or first election
    const urlId = parseInt(new URLSearchParams(window.location.search).get('electionId'));
    const sel = document.getElementById('electionSelect');
    if (urlId && allElections.find(e => e.electionId === urlId)) {
      sel.value = urlId;
    } else if (allElections.length) {
      sel.value = allElections[0].electionId;
    }
    onElectionChange();
  }

  function populateDropdown() {
    const status = document.getElementById('statusFilter').value;
    const filtered = status ? allElections.filter(e => e.status === status) : allElections;
    const sel = document.getElementById('electionSelect');
    const prev = sel.value;
    sel.innerHTML = '<option value="">-- Select an election --</option>';
    filtered.forEach(e => {
      sel.innerHTML += `<option value="${e.electionId}">[${e.status}] ${e.electionName}</option>`;
    });
    // Restore selection if still in list
    if (prev && filtered.find(e => e.electionId == prev)) sel.value = prev;
    onElectionChange();
  }

  function onElectionChange() {
    const id = parseInt(document.getElementById('electionSelect').value);
    const election = allElections.find(e => e.electionId === id);
    if (!election) {
      document.getElementById('resultsContent').innerHTML =
        '<div class="no-data">Select an election from the dropdown above to view results.</div>';
      return;
    }
    renderResults(election);
  }

  function renderResults(election) {
    const total = election.totalVotes || 0;
    const content = document.getElementById('resultsContent');

    const statusBadge = election.status === 'Active'
      ? `<span class="badge badge-active">Active</span>`
      : election.status === 'Closed'
      ? `<span class="badge badge-closed">Closed</span>`
      : `<span class="badge badge-draft">Upcoming</span>`;

    let rows = '';
    if (!election.results || !election.results.length) {
      rows = '<div class="no-data">No candidates registered for this election yet.</div>';
    } else {
      const rowsHtml = election.results.map((r, i) => {
        const pct = total > 0 ? ((r.totalVotes / total) * 100).toFixed(1) : 0;
        const isWinner = i === 0 && r.totalVotes > 0;
        const colors = ['green', '', 'purple', 'amber'];
        return `
          <div class="result-row ${isWinner ? 'winner' : ''}">
            <div class="rank ${isWinner ? 'first' : ''}">${i + 1}</div>
            <div class="avatar">${r.candidateName.charAt(0).toUpperCase()}</div>
            <div class="cand-info">
              <div class="cand-name">${r.candidateName}${isWinner && election.status === 'Closed' ? ' <span style="color:var(--amber);font-size:0.75rem;">Winner</span>' : ''}</div>
              <div class="cand-party">${r.party || 'Independent'}</div>
            </div>
            <div class="bar-wrap">
              <div class="progress-bar"><div class="progress-fill ${colors[i] || ''}" style="width:${pct}%"></div></div>
            </div>
            <div class="vote-count" style="${isWinner ? 'color:var(--green)' : ''}">${r.totalVotes}</div>
            <div class="vote-pct">${pct}%</div>
          </div>`;
      }).join('');
      rows = `<div class="result-wrap">${rowsHtml}</div>`;
    }

    content.innerHTML = `
      <div class="election-info">
        <h2>${election.electionName}</h2>
        ${statusBadge}
        <span class="text-muted text-sm">Ends: ${new Date(election.endDate).toLocaleDateString()}</span>
        <span class="text-muted text-sm">${total} vote${total !== 1 ? 's' : ''} cast</span>
        <span class="text-muted text-sm">${election.results ? election.results.length : 0} candidate${(election.results?.length || 0) !== 1 ? 's' : ''}</span>
      </div>
      ${rows}
      ${election.status === 'Active' ? `<div class="alert alert-info">This election is still active — results update as votes come in.</div>` : ''}`;
  }

  loadResults();
</script>
</body>
</html>
