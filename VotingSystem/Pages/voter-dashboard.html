<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard — VoteMS</title>
  <link rel="stylesheet" href="../styles.css"/>
  <style>
    .election-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
    .election-card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius-lg); padding: 24px;
      transition: border-color 0.2s, transform 0.2s;
      text-decoration: none; color: inherit; display: block;
    }
    .election-card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .election-card.voted { border-color: var(--green); }
    .election-meta { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
    .election-title { font-family: 'Syne', sans-serif; font-size: 1.05rem; font-weight: 700; margin-bottom: 6px; }
    .election-desc { font-size: 0.85rem; color: var(--muted); line-height: 1.5; margin-bottom: 16px; }
    .election-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 14px; border-top: 1px solid var(--border); }
    .election-stat { font-size: 0.8rem; color: var(--muted); }
    .election-stat strong { color: var(--text); font-weight: 600; }
    .voted-check { display: flex; align-items: center; gap: 6px; font-size: 0.82rem; color: var(--green); font-weight: 500; }
    .deadline { font-size: 0.78rem; color: var(--muted); margin-top: 8px; }
    .deadline span { color: var(--amber); }
  </style>
</head>
<body>

<nav>
  <a href="../index.html" class="nav-logo"><div class="dot"></div> VoteMS</a>
  <div class="nav-links">
    <a href="voter-dashboard.html" class="active">My Elections</a>
    <a href="results.html">Results</a>
    <a href="../index.html">Sign out</a>
  </div>
</nav>

<div class="page">

  <!-- Header -->
  <div class="flex justify-between items-center mb-4">
    <div>
      <h1>Active Elections</h1>
      <p class="subtitle">Select an election below to cast your vote</p>
    </div>
    <div class="card card-sm text-right" style="padding:14px 20px;">
      <div class="text-sm text-muted">Logged in as</div>
      <div style="font-weight:600;margin-top:2px;">John Doe</div>
      <div class="mt-1"><span class="badge badge-voter">Voter</span></div>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">Active Elections</div>
      <div class="stat-value" style="color:var(--accent);">3</div>
      <div class="stat-sub">Open for voting</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Votes Cast</div>
      <div class="stat-value" style="color:var(--green);">1</div>
      <div class="stat-sub">Out of 3 elections</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Closed Elections</div>
      <div class="stat-value" style="color:var(--muted);">2</div>
      <div class="stat-sub">Results available</div>
    </div>
  </div>

  <!-- Elections -->
  <h2>Open for Voting</h2>
  <div class="election-grid mb-4" id="activeGrid">
    <p class="text-muted text-sm">Loading...</p>
  </div>

  <!-- Closed elections -->
  <h2>Closed Elections</h2>
  <div class="election-grid" id="closedGrid">
    <p class="text-muted text-sm">Loading...</p>
  </div>

</div>
</div>

<script>
  const API = 'http://localhost:5099';
  const token = localStorage.getItem('token');
  if (!token) location.href = 'login.html';

  const fullName = localStorage.getItem('fullName') || 'Voter';
  document.querySelector('.card.card-sm div[style*="font-weight"]').textContent = fullName;

  function authHeaders() {
    return { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' };
  }

  async function loadDashboard() {
    try {
      // Load voter profile + stats
      const meRes = await fetch(`${API}/api/voter/me`, { headers: authHeaders() });
      if (meRes.status === 401) { localStorage.clear(); location.href = 'login.html'; return; }
      const me = await meRes.json();

      document.querySelector('.card.card-sm div[style*="font-weight"]').textContent = me.fullName;
      document.querySelectorAll('.stat-value')[0].textContent = me.activeElections;
      document.querySelectorAll('.stat-sub')[0].textContent  = 'Open for voting';
      document.querySelectorAll('.stat-value')[1].textContent = me.votesCast;
      document.querySelectorAll('.stat-sub')[1].textContent  = `Out of ${me.activeElections} elections`;
      document.querySelectorAll('.stat-value')[2].textContent = me.closedElections;

      // Load elections
      const elRes = await fetch(`${API}/api/voter/elections`, { headers: authHeaders() });
      const elections = await elRes.json();

      const active = elections.filter(e => e.status === 'Active');
      const closed = elections.filter(e => e.status !== 'Active');

      renderElections(active, document.getElementById('activeGrid'), false);
      renderElections(closed, document.getElementById('closedGrid'), true);
    } catch(err) {
      console.error(err);
    }
  }

  function renderElections(list, container, isClosed) {
    container.innerHTML = '';
    if (!list.length) {
      container.innerHTML = '<p class="text-muted text-sm">No elections found.</p>';
      return;
    }
    list.forEach(e => {
      const card = document.createElement(e.hasVoted || isClosed ? 'div' : 'a');
      card.className = 'election-card' + (e.hasVoted ? ' voted' : '') + (isClosed ? '' : '');
      if (!e.hasVoted && !isClosed) card.href = `cast-vote.html?electionId=${e.electionId}`;
      if (isClosed) card.style.opacity = '0.7';

      const badgeClass = e.status === 'Active' ? 'badge-active' : 'badge-closed';
      const votedBadge = e.hasVoted
        ? '<div class="voted-check">✔ Voted</div>'
        : `<span class="text-sm text-muted">${isClosed ? '' : 'Not voted'}</span>`;
      const actionBtn = e.hasVoted || isClosed
        ? `<a href="results.html?electionId=${e.electionId}" class="btn btn-${e.hasVoted ? 'success' : 'secondary'} btn-sm">View results</a>`
        : `<span class="btn btn-primary btn-sm">Vote now →</span>`;

      card.innerHTML = `
        <div class="election-meta">
          <span class="badge ${badgeClass}">${e.status}</span>
          ${votedBadge}
        </div>
        <div class="election-title">${e.electionName}</div>
        <div class="election-desc">Cast your vote in this election.</div>
        <div class="deadline">Closes: <span>${new Date(e.endDate).toLocaleDateString()}</span></div>
        <div class="election-footer">
          <div class="election-stat"><strong>${e.candidateCount}</strong> candidates</div>
          ${actionBtn}
        </div>`;
      container.appendChild(card);
    });
  }

  loadDashboard();
</script>

</html>
