<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Manage Elections — VoteMS Admin</title>
  <link rel="stylesheet" href="../styles.css"/>
  <style>
    .sidebar {
      position: fixed; left: 0; top: 0; bottom: 0; width: 230px;
      background: var(--bg2); border-right: 1px solid var(--border);
      padding: 24px 16px; display: flex; flex-direction: column; gap: 4px; z-index: 200;
    }
    .sidebar-logo { font-family: 'Syne', sans-serif; font-size: 1.1rem; font-weight: 800; display: flex; align-items: center; gap: 8px; padding: 8px 12px; margin-bottom: 20px; }
    .sidebar-logo .dot { width: 10px; height: 10px; background: var(--accent); border-radius: 50%; }
    .sidebar-section { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; padding: 8px 12px 4px; }
    .sidebar-link { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; text-decoration: none; font-size: 0.88rem; font-weight: 500; color: var(--muted); transition: all 0.15s; }
    .sidebar-link:hover { background: var(--bg3); color: var(--text); }
    .sidebar-link.active { background: var(--bg3); color: var(--text); }
    .sidebar-link .icon { font-size: 1rem; width: 20px; text-align: center; }
    .sidebar-footer { margin-top: auto; padding-top: 16px; border-top: 1px solid var(--border); }
    .main { margin-left: 230px; padding: 36px 40px; }
    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 300; display: none; align-items: center; justify-content: center; padding: 20px; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 32px; width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; }
    .modal h2 { margin-bottom: 6px; }
    .modal-footer { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }
  </style>
</head>
<body>

<aside class="sidebar">
  <div class="sidebar-logo"><div class="dot"></div> VoteMS <span class="badge badge-admin" style="margin-left:auto;font-size:0.65rem;">Admin</span></div>
  <div class="sidebar-section">Overview</div>
  <a href="admin-dashboard.html" class="sidebar-link"><span class="icon">📊</span> Dashboard</a>
  <a href="admin-elections.html" class="sidebar-link active"><span class="icon">🗳️</span> Elections</a>
  <a href="admin-voters.html" class="sidebar-link"><span class="icon">👥</span> Voters</a>
  <a href="admin-candidates.html" class="sidebar-link"><span class="icon">🏅</span> Candidates</a>
  <div class="sidebar-section" style="margin-top:8px;">Reports</div>
  <a href="results.html" class="sidebar-link"><span class="icon">📈</span> Results</a>
  <a href="admin-reports.html" class="sidebar-link"><span class="icon">📋</span> Reports</a>
  <div class="sidebar-footer">
    <div style="font-size:0.82rem;color:var(--muted);padding:0 12px 10px;">Admin User</div>
    <a href="login.html" class="sidebar-link"><span class="icon">🚪</span> Sign out</a>
  </div>
</aside>

<main class="main">
  <div class="flex justify-between items-center mb-4">
    <div>
      <h1>Manage Elections</h1>
      <p class="subtitle">Create, edit, and control all elections</p>
    </div>
    <button class="btn btn-primary" onclick="document.getElementById('newModal').classList.add('open')">+ New Election</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>Title</th><th>Status</th><th>Candidates</th><th>Votes</th><th>Start</th><th>End</th><th>Actions</th></tr>
      </thead>
      <tbody id="electionsBody"><tr><td colspan="7" class="text-muted">Loading...</td></tr></tbody>
    </table>
  </div>
</main>

<!-- New Election Modal -->
<div class="modal-overlay" id="newModal">
  <div class="modal">
    <h2>Create New Election</h2>
    <p class="text-muted text-sm mb-3">Fill in the details for the new election</p>
    <div class="form-group"><label>Election Title</label><input type="text" id="newTitle" placeholder="e.g. Student Council President 2026"/></div>
    <div class="grid-2">
      <div class="form-group"><label>Start Date</label><input type="date" id="newStart"/></div>
      <div class="form-group"><label>End Date</label><input type="date" id="newEnd"/></div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="document.getElementById('newModal').classList.remove('open')">Cancel</button>
      <button class="btn btn-primary" onclick="createElection()">Create Election</button>
    </div>
  </div>
</div>

<script>
  const API = 'http://localhost:5099';
  const token = localStorage.getItem('token');
  if (!token) location.href = 'login.html';
  function authH() { return { 'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json' }; }

  async function loadElections() {
    const res = await fetch(`${API}/api/admin/elections`, { headers: authH() });
    if (res.status === 401) { localStorage.clear(); location.href = 'login.html'; return; }
    const elections = await res.json();
    const tbody = document.getElementById('electionsBody');
    tbody.innerHTML = '';
    if (!elections.length) { tbody.innerHTML = '<tr><td colspan="7" class="text-muted">No elections found.</td></tr>'; return; }
    elections.forEach(e => {
      const badgeClass = e.status === 'Active' ? 'badge-active' : e.status === 'Closed' ? 'badge-closed' : 'badge-draft';
      const actions = e.status === 'Active'
        ? `<button class="btn btn-danger btn-sm" onclick="closeElection(${e.electionId})">Close</button>`
        : `<button class="btn btn-danger btn-sm" onclick="deleteElection(${e.electionId})">Delete</button>
           <a href="results.html?electionId=${e.electionId}" class="btn btn-success btn-sm">Results</a>`;
      tbody.innerHTML += `
        <tr>
          <td><strong>${e.electionName}</strong></td>
          <td><span class="badge ${badgeClass}">${e.status}</span></td>
          <td>${e.candidateCount}</td><td>${e.voteCount}</td>
          <td class="text-muted">${new Date(e.startDate).toLocaleDateString()}</td>
          <td class="${e.status === 'Active' ? '' : 'text-muted'}">${new Date(e.endDate).toLocaleDateString()}</td>
          <td><div style="display:flex;gap:6px;">${actions}</div></td>
        </tr>`;
    });
  }

  async function createElection() {
    const title = document.getElementById('newTitle').value.trim();
    const start = document.getElementById('newStart').value;
    const end   = document.getElementById('newEnd').value;
    if (!title || !start || !end) { alert('Please fill all fields'); return; }
    await fetch(`${API}/api/admin/create-election`, {
      method: 'POST', headers: authH(),
      body: JSON.stringify({ electionName: title, startDate: start, endDate: end })
    });
    document.getElementById('newModal').classList.remove('open');
    loadElections();
  }

  async function closeElection(id) {
    if (!confirm('Close this election?')) return;
    await fetch(`${API}/api/admin/election/${id}/close`, { method: 'PUT', headers: authH() });
    loadElections();
  }

  async function deleteElection(id) {
    if (!confirm('Delete this election?')) return;
    await fetch(`${API}/api/admin/election/${id}`, { method: 'DELETE', headers: authH() });
    loadElections();
  }

  document.querySelectorAll('.modal-overlay').forEach(o => o.addEventListener('click', e => { if (e.target === o) o.classList.remove('open'); }));
  loadElections();
</script>
</body>
</html>
