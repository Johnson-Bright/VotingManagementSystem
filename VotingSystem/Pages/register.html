<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Register — VoteMS</title>
  <link rel="stylesheet" href="../styles.css"/>
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 40px 20px; }
    .wrap { width: 100%; max-width: 460px; }
    .logo-block { text-align: center; margin-bottom: 32px; }
    .logo-icon {
      width: 56px; height: 56px; border-radius: 16px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; margin: 0 auto 14px;
    }
    .card { animation: fadeUp 0.4s ease; }
    @keyframes fadeUp { from { opacity:0; transform: translateY(16px); } to { opacity:1; transform: translateY(0); } }
    .footer-link { text-align: center; font-size: 0.85rem; color: var(--muted); margin-top: 20px; }
    .footer-link a { color: var(--accent); text-decoration: none; }
    .step-dots { display: flex; gap: 6px; justify-content: center; margin-bottom: 24px; }
    .step-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border); }
    .step-dot.active { background: var(--accent); width: 24px; border-radius: 4px; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="logo-block">
    <div class="logo-icon">🗳️</div>
    <h1 style="font-family:'Syne',sans-serif;font-size:1.6rem;font-weight:800;">VoteMS</h1>
    <p style="color:var(--muted);font-size:0.9rem;margin-top:4px;" id="roleSubtitle">Create your voter account</p>
  </div>

  <div class="card">
    <h2 style="margin-bottom:4px;">Create account</h2>
    <p class="text-muted text-sm mb-3">Choose your role to get started</p>

    <!-- Role selector -->
    <div class="form-group">
      <label>Register as</label>
      <div style="display:flex;gap:8px;">
        <button type="button" class="role-btn active" data-role="voter" onclick="setRole('voter')">🗳️ Voter</button>
        <button type="button" class="role-btn" data-role="candidate" onclick="setRole('candidate')">🏅 Candidate</button>
      </div>
    </div>

    <div class="grid-2">
      <div class="form-group">
        <label>First name</label>
        <input type="text" id="firstName" placeholder="John" />
      </div>
      <div class="form-group">
        <label>Last name</label>
        <input type="text" id="lastName" placeholder="Doe" />
      </div>
    </div>

    <div class="form-group">
      <label>Email address</label>
      <input type="email" id="email" placeholder="john@example.com" />
    </div>

    <div class="form-group">
      <label>Create password</label>
      <input type="password" id="password" placeholder="••••••••" />
    </div>

    <div class="form-group">
      <label>Confirm password</label>
      <input type="password" id="confirmPassword" placeholder="••••••••" />
    </div>

    <div class="form-group">
      <label>National ID</label>
      <input type="text" id="nationalId" placeholder="e.g. 1 1990 8 0123456 7 89" />
    </div>

    <div class="form-group">
      <label>Date of Birth</label>
      <input type="date" />
    </div>

    <div class="form-group">
      <label>Address</label>
      <input type="text" placeholder="Your residential address" />
    </div>

    <!-- Candidate-only fields -->
    <div id="candidateFields" style="display:none;">
      <hr class="divider"/>
      <p style="font-size:0.82rem;font-weight:600;color:var(--accent);margin-bottom:14px;">🏅 Candidate Details</p>
      <div class="form-group">
        <label>Party / Affiliation</label>
        <input type="text" id="party" placeholder="e.g. Progressive Students Alliance" />
      </div>
      <div class="form-group">
        <label>Position Applying For</label>
        <select id="position">
          <option value="">Select a position...</option>
          <option>Student Council President</option>
          <option>Vice President</option>
          <option>Secretary</option>
          <option>Faculty Representative</option>
          <option>Sports Captain</option>
        </select>
      </div>
      <div class="form-group">
        <label>Manifesto / Campaign Statement</label>
        <textarea rows="3" id="manifesto" placeholder="Briefly describe your goals and plans..."></textarea>
      </div>
    </div>

    <div class="form-group" style="margin-bottom:24px;">
      <label style="display:flex;align-items:flex-start;gap:10px;margin:0;cursor:pointer;font-size:0.85rem;color:var(--muted);">
        <input type="checkbox" style="width:auto;margin-top:3px;" />
        I agree to the <a href="#" style="color:var(--accent);text-decoration:none;margin-left:3px;">Terms & Conditions</a> and confirm my details are accurate
      </label>
    </div>

    <button class="btn btn-primary btn-full btn-lg" onclick="doRegister()">Create account</button>
  </div>

  <div class="footer-link">
    Already have an account? <a href="login.html">Sign in</a>
  </div>

  <style>
    .role-btn {
      flex: 1; padding: 9px 10px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--bg3); color: var(--muted); font-size: 0.82rem; font-weight: 500;
      cursor: pointer; transition: all 0.18s; font-family: 'DM Sans', sans-serif;
    }
    .role-btn:hover { border-color: var(--accent); color: var(--text); }
    .role-btn.active { background: var(--accent); border-color: var(--accent); color: white; }
  </style>
  <script>
    const API_BASE_URL = 'http://localhost:5099';
    let currentRole = 'voter';
    function setRole(role) {
      currentRole = role;
      document.querySelectorAll('.role-btn').forEach(b => b.classList.toggle('active', b.dataset.role === role));
      document.getElementById('candidateFields').style.display = role === 'candidate' ? 'block' : 'none';
      document.getElementById('roleSubtitle').textContent = role === 'candidate' ? 'Create your candidate account' : 'Create your voter account';
    }
    function doRegister() {
      const firstName = document.getElementById('firstName').value.trim();
      const lastName = document.getElementById('lastName').value.trim();
      const fullName = `${firstName} ${lastName}`.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const nationalId = document.getElementById('nationalId').value.trim();

      if (!firstName || !lastName || !email || !password || !confirmPassword) {
        alert('Please fill in all required fields');
        return;
      }

      if (password !== confirmPassword) {
        alert('Passwords do not match');
        return;
      }

      if (password.length < 8) {
        alert('Password must be at least 8 characters long');
        return;
      }

      const role = currentRole === 'candidate' ? 'Candidate' : 'Voter';

      const body = {
        fullName,
        email,
        password,
        role,
        nationalId: role === 'Voter' ? nationalId : ''
      };

      fetch(`${API_BASE_URL}/api/auth/register`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      })
      .then(async (res) => {
        const raw = await res.text();
        let data = {};

        try {
          data = raw ? JSON.parse(raw) : {};
        } catch {
          data = { message: raw };
        }

        if (!res.ok) {
          throw new Error(data.message || 'Registration failed');
        }

        alert(data.message || 'Registration successful! Please login.');
        location.href = 'login.html';
      })
      .catch(err => {
        alert('Error: ' + err.message);
      });
    }
  </script>
</div>
</body>
</html>
