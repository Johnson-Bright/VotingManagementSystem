<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In — VoteMS</title>
  <link rel="stylesheet" href="../styles.css?v=4"/>
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg); }
    .login-wrap { width: 100%; max-width: 420px; padding: 20px; }
    .logo-block { text-align: center; margin-bottom: 32px; }
    .logo-mark { width: 52px; height: 52px; border-radius: 14px; background: var(--accent); display: flex; align-items: center; justify-content: center; margin: 0 auto 14px; }
    .logo-mark svg { width: 26px; height: 26px; fill: white; }
    .logo-block h1 { font-size: 1.6rem; color: var(--text); }
    .logo-block p { color: var(--muted); font-size: 0.9rem; margin-top: 4px; }
    .footer-link { text-align: center; font-size: 0.85rem; color: var(--muted); margin-top: 20px; }
    .footer-link a { color: var(--accent); text-decoration: none; font-weight: 500; }
    .footer-link a:hover { text-decoration: underline; }
    .card { animation: fadeUp 0.35s ease; }
    @keyframes fadeUp { from { opacity:0; transform: translateY(14px); } to { opacity:1; transform: translateY(0); } }
    .error-msg { color: var(--red); font-size: 0.85rem; margin-top: 10px; text-align: center; display: none; }
  </style>
</head>
<body>
<div class="login-wrap">
  <div class="logo-block">
    <div class="logo-mark">
      <svg viewBox="0 0 24 24"><path d="M9 11l3 3L22 4M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
    </div>
    <h1>VoteMS</h1>
    <p>Voting Management System</p>
  </div>

  <div class="card">
    <h2 style="margin-bottom:6px;">Welcome back</h2>
    <p class="text-muted text-sm mb-3">Sign in to your account to continue</p>

    <div class="alert alert-info" style="margin-bottom:18px;">
      Your vote is private and securely recorded.
    </div>

    <div class="form-group">
      <label>Sign in as</label>
      <div style="display:flex;gap:8px;" id="roleSelector">
        <button type="button" class="role-btn active" data-role="voter" onclick="setRole('voter')">Voter</button>
        <button type="button" class="role-btn" data-role="candidate" onclick="setRole('candidate')">Candidate</button>
        <button type="button" class="role-btn" data-role="admin" onclick="setRole('admin')">Admin</button>
      </div>
    </div>

    <div class="form-group">
      <label>Email address</label>
      <input id="email" type="email" placeholder="you@example.com"/>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input id="password" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()"/>
    </div>

    <div class="flex justify-between items-center mb-3" style="margin-top:-6px;">
      <label style="display:flex;align-items:center;gap:8px;margin:0;cursor:pointer;font-size:0.85rem;color:var(--muted);">
        <input id="remember" type="checkbox" style="width:auto;margin:0;"/> Remember me
      </label>
    </div>

    <button class="btn btn-primary btn-full btn-lg" onclick="doLogin()">Sign in</button>
    <div class="error-msg" id="errMsg">Invalid email or password.</div>
  </div>

  <div class="footer-link">Don't have an account? <a href="register.html">Create one</a></div>
</div>

<script>
  let currentRole = 'voter';
  function setRole(role) {
    currentRole = role;
    document.querySelectorAll('.role-btn').forEach(b => b.classList.toggle('active', b.dataset.role === role));
  }

  async function doLogin() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const errMsg = document.getElementById('errMsg');
    errMsg.style.display = 'none';
    if (!email || !password) { errMsg.textContent = 'Please enter your email and password.'; errMsg.style.display = 'block'; return; }

    const res = await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type':'application/json' }, body: JSON.stringify({ email, password }) });
    if (!res.ok) { errMsg.textContent = 'Invalid email or password.'; errMsg.style.display = 'block'; return; }
    const body = await res.json();

    const store = document.getElementById('remember').checked ? localStorage : sessionStorage;
    store.setItem('userId', body.userId);
    store.setItem('role', body.role);
    // also set in localStorage for cross-page access
    localStorage.setItem('userId', body.userId);
    localStorage.setItem('role', body.role);

    if (body.role === 'Admin') location.href = 'admin-dashboard.html';
    else if (body.role === 'Candidate') location.href = 'candidate-dashboard.html';
    else location.href = 'voter-dashboard.html';
  }
</script>
</body>
</html>
