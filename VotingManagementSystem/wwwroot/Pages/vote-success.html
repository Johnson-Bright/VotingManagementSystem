<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vote Submitted — VoteMS</title>
  <link rel="stylesheet" href="../styles.css?v=4"/>
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg); }
    .wrap { text-align: center; max-width: 460px; padding: 20px; }
    .success-icon {
      width: 72px; height: 72px; border-radius: 50%;
      background: #ECFDF5; border: 2px solid #A7F3D0;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px;
      animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .success-icon svg { width: 32px; height: 32px; stroke: var(--green); stroke-width: 2.5; fill: none; }
    @keyframes pop { from { transform: scale(0); opacity:0; } to { transform: scale(1); opacity:1; } }
    .receipt { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px; margin: 24px 0; text-align: left; }
    .receipt-row { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 0.88rem; }
    .receipt-row:last-child { border-bottom: none; }
    .receipt-row span:first-child { color: var(--muted); }
    .receipt-row span:last-child { font-weight: 500; }
    h1 { color: var(--green); }
  </style>
</head>
<body>
<div class="wrap">
  <div class="success-icon">
    <svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>
  </div>
  <h1>Vote submitted!</h1>
  <p class="text-muted" style="margin-top:8px;">Your vote has been securely recorded. Thank you for participating.</p>

  <div class="receipt">
    <div style="font-size:0.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.07em;margin-bottom:12px;font-weight:600;">Vote Receipt</div>
    <div class="receipt-row">
      <span>Election</span>
      <span id="receiptElection">—</span>
    </div>
    <div class="receipt-row">
      <span>Voted for</span>
      <span id="receiptCandidate" style="color:var(--accent);">—</span>
    </div>
    <div class="receipt-row">
      <span>Time</span>
      <span id="receiptTime">—</span>
    </div>
    <div class="receipt-row">
      <span>Status</span>
      <span style="color:var(--green);font-weight:600;">Confirmed</span>
    </div>
  </div>

  <div class="alert alert-info" style="text-align:left;">
    Your vote is anonymous. This receipt only confirms participation, not your specific choice.
  </div>

  <div class="flex gap-3 mt-3" style="justify-content:center;">
    <a href="voter-dashboard.html" class="btn btn-secondary">Back to elections</a>
    <a href="results.html" id="resultsLink" class="btn btn-primary">View results</a>
  </div>
</div>
<script>
  document.getElementById('receiptElection').textContent = sessionStorage.getItem('lastVoteElection') || '—';
  document.getElementById('receiptCandidate').textContent = sessionStorage.getItem('lastVoteCandidate') || '—';
  document.getElementById('receiptTime').textContent = new Date().toLocaleString();
  const eid = sessionStorage.getItem('lastVoteElectionId');
  if (eid) document.getElementById('resultsLink').href = 'results.html?electionId=' + eid;
</script>
</body>
</html>
